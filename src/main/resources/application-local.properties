# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Uses an in-memory H2 database (data resets on every restart). No MySQL needed.
spring.datasource.url=jdbc:h2:mem:bharatexplore;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
