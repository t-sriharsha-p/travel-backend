spring.application.name=bharatexplore-backend
server.port=${PORT:8080}

# ---- MySQL (default profile). Override with environment variables in production ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bharatexplore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Security ----
# MUST be at least 32 characters. Set a long random value in production.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Comma-separated list. Wildcards allowed, e.g. https://*.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Google Gemini (AI travel planner) ----
# Without a key the planner falls back to a rule-based itinerary built from database data.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.timeout-seconds=60
